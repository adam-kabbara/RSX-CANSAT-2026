# Four combinations:
# night_mode = false, high_contrast_mode = false -> day
# night_mode = true, high_contrast_mode = false -> night
# night_mode = false, high_contrast_mode = true -> high_contrast
# night_mode = true, high_contrast_mode = true -> black_high_contrast
night_mode = true
high_contrast_mode = false

[windows.live_data]
resolution = [1600, 900]
display_mode = "fullscreen"

[windows.command_panel]
resolution = [1920, 540]
display_mode = "fullscreen"

[map.tile_checker]
enabled = true

[map.tile_checker.ranges]
12 = [1141, 1143]
13 = [2283, 2285]
14 = [4567, 4570]
15 = [9135, 9140]
16 = [18271, 18280]
17 = [36542, 36559]
18 = [73085, 73117]
19 = [146170, 146234]

[modes.day.logs]
gui_normal = "black"
gui_error = "red"
sat_normal = "black"
sat_error = "red"
background = "#dcdcdc"
overlay_background = "rgba(0, 0, 0, 215)"
overlay_text = "white"

[modes.day.status]
init = "GREY"
red = "RED"
green = "GREEN"
blue = "BLUE"
label_text = "black"
previous_state = "green"
current_state = "blue"
skipped_state = "red"
next_state = "grey"

[modes.day.inputs]
background = "#f0f0f0"
border = "#cccccc"
focus_border = "#0078d4"
focus_background = "#ffffff"

[modes.day.graph]
